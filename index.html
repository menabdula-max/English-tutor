<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AI Tutor" />
  <title>AI English Speaking Tutor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    header { padding: 14px 18px; background: #1e293b; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    header h1 { font-size: 17px; font-weight: 600; color: #38bdf8; }
    .icon-btn { background: #334155; color: #e2e8f0; border: none; padding: 6px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 85%; padding: 12px 15px; border-radius: 16px; font-size: 15px; line-height: 1.45; word-wrap: break-word; }
    .user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
    .ai { align-self: flex-start; background: #1e293b; color: #f1f5f9; border: 1px solid #334155; border-bottom-left-radius: 4px; }
    .controls { padding: 16px 20px 28px; background: #1e293b; border-top: 1px solid #334155; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    #status { font-size: 13px; color: #94a3b8; min-height: 18px; text-align: center; }
    #micBtn { width: 76px; height: 76px; border-radius: 50%; border: none; background: #2563eb; color: white; font-size: 32px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(37, 99, 235, 0.45); cursor: pointer; transition: transform 0.15s, background 0.2s; -webkit-tap-highlight-color: transparent; }
    #micBtn:active { transform: scale(0.94); }
    #micBtn.listening { background: #ef4444; box-shadow: 0 0 0 10px rgba(239, 68, 68, 0.25); animation: pulse 1.3s infinite; }
    #micBtn.speaking { background: #10b981; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); } 70% { box-shadow: 0 0 0 16px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    #setupModal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
    .modal-box { background: #1e293b; padding: 24px; border-radius: 16px; width: 100%; max-width: 400px; border: 1px solid #334155; }
    .modal-box h2 { font-size: 18px; margin-bottom: 8px; color: #38bdf8; }
    .modal-box p { font-size: 13px; color: #cbd5e1; margin-bottom: 14px; line-height: 1.4; }
    .modal-box input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; margin-bottom: 14px; }
    .modal-box button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #2563eb; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

<div id="setupModal" style="display:none;">
  <div class="modal-box">
    <h2>API Kalitni Kiriting</h2>
    <p>Google AI Studio'dan olgan bepul kalitingizni (AIzaSy...) joylang. U faqat sizning qurilmangiz xotirasida saqlanadi.</p>
    <input type="password" id="apiKeyInput" placeholder="AIzaSy..." />
    <button onclick="saveKey()">Saqlash va Boshlash</button>
  </div>
</div>

<header>
  <h1>AI Speaking Tutor</h1>
  <div>
    <button class="icon-btn" onclick="resetChat()">Tozalash</button>
    <button class="icon-btn" onclick="openKeyModal()">Kalit</button>
  </div>
</header>

<div id="chat"></div>

<div class="controls">
  <div id="status">Gapirish uchun mikrofonni bosing</div>
  <button id="micBtn" onclick="toggleMic()">🎙️</button>
</div>

<script>
  const SYSTEM_PROMPT = `You are a friendly, patient, and expert English speaking tutor. 
Have a natural spoken conversation in simple, clear English suitable for a learner.
Keep your responses concise (2 to 4 short sentences) so it feels like a real spoken dialogue, and always end with an engaging follow-up question to keep the user talking.
If the user makes a grammar or vocabulary mistake, gently show the corrected English sentence and add a very brief 1-sentence explanation in Uzbek (in parentheses), then naturally continue the conversation in English.
Do not use markdown symbols like asterisks or bullet points because your text will be read aloud by speech synthesis.`;

  let history = [];
  let isListening = false;
  let recognition = null;

  const chatEl = document.getElementById('chat');
  const statusEl = document.getElementById('status');
  const micBtn = document.getElementById('micBtn');
  const setupModal = document.getElementById('setupModal');

  function getApiKey() { return localStorage.getItem('gemini_api_key') || ''; }
  function openKeyModal() {
    document.getElementById('apiKeyInput').value = getApiKey();
    setupModal.style.display = 'flex';
  }
  function saveKey() {
    const val = document.getElementById('apiKeyInput').value.trim();
    if (!val) return alert('Iltimos, kalitni kiriting!');
    localStorage.setItem('gemini_api_key', val);
    setupModal.style.display = 'none';
    if (history.length === 0) greetUser();
  }

  function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = 'msg ' + sender;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function speakText(text) {
    window.speechSynthesis.cancel();
    const englishOnly = text.replace(/\([^)]*\)/g, '').trim();
    const utter = new SpeechSynthesisUtterance(englishOnly || text);
    utter.lang = 'en-US';
    utter.rate = 0.95;
    const voices = window.speechSynthesis.getVoices();
    const preferred = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Samantha') || v.name.includes('Daniel') || v.name.includes('Google')));
    if (preferred) utter.voice = preferred;

    utter.onstart = () => { micBtn.classList.add('speaking'); statusEl.textContent = 'AI gapirmoqda...'; };
    utter.onend = () => { micBtn.classList.remove('speaking'); statusEl.textContent = 'Javob berish uchun mikrofonni bosing'; };
    window.speechSynthesis.speak(utter);
  }

  async function askGemini(userText) {
    const apiKey = getApiKey();
    if (!apiKey) { openKeyModal(); return; }

    statusEl.textContent = 'O‘ylamoqda...';
    history.push({ role: 'user', parts: [{ text: userText }] });

    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${encodeURIComponent(apiKey)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
          contents: history
        })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);

      const reply = data.candidates[0].content.parts[0].text.trim();
      history.push({ role: 'model', parts: [{ text: reply }] });
      addMessage(reply, 'ai');
      speakText(reply);
    } catch (err) {
      statusEl.textContent = 'Xatolik: ' + err.message;
      history.pop();
    }
  }

  function initSpeech() {
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRec) {
      statusEl.textContent = 'Brauzer ovozni qo‘llab-quvvatlamaydi (Safari ishlating)';
      return;
    }
    recognition = new SpeechRec();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add('listening');
      statusEl.textContent = 'Eshitmoqdaman... Inglizcha gapiring';
    };
    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      addMessage(transcript, 'user');
      askGemini(transcript);
    };
    recognition.onerror = (event) => {
      isListening = false;
      micBtn.classList.remove('listening');
      statusEl.textContent = event.error === 'no-speech' ? 'Ovoz eshitilmadi, qayta bosing' : 'Mikrofon xatosi: ' + event.error;
    };
    recognition.onend = () => {
      isListening = false;
      micBtn.classList.remove('listening');
    };
  }

  function toggleMic() {
    window.speechSynthesis.cancel();
    micBtn.classList.remove('speaking');
    if (!recognition) initSpeech();
    if (!recognition) return;

    if (isListening) {
      recognition.stop();
    } else {
      try { recognition.start(); } catch (e) {}
    }
  }

  function greetUser() {
    const hello = "Hello! I am your English speaking tutor. How are you doing today, and what would you like to talk about?";
    addMessage(hello, 'ai');
    speakText(hello);
  }

  function resetChat() {
    window.speechSynthesis.cancel();
    history = [];
    chatEl.innerHTML = '';
    greetUser();
  }

  window.speechSynthesis.onvoiceschanged = () => {};
  window.onload = () => {
    initSpeech();
    if (!getApiKey()) {
      openKeyModal();
    } else {
      greetUser();
    }
  };
</script>
</body>
</html>
